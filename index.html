<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DGS Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    overflow:hidden;
    height:100vh;
    background:#050505;
    font-family:'Cormorant Garamond', serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e5e5;
    position:relative;
}
.full-bg {
    position: fixed;
    inset: 0;
    background: url("art.jpg") center center/cover no-repeat;
    opacity: 0.25; 
    z-index: 1;
    filter: blur(3px); 
}
.overlay-dark {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 5, 0.6);
    z-index: 2;
}
.intro-overlay {
    position: fixed;
    inset: 0;
    background: #030303;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1.2s ease, visibility 1.2s;
}
.intro-btn {
    background: transparent;
    border: 1px solid #c5a880;
    color: #c5a880;
    font-family: 'Cinzel', serif;
    padding: 16px 45px;
    font-size: 0.95rem;
    letter-spacing: 5px;
    cursor: pointer;
    transition: all 0.4s ease;
    border-radius: 2px;
    z-index: 101;
}
.intro-btn:hover {
    background: #c5a880;
    color: #050505;
    box-shadow: 0 0 25px rgba(197, 168, 128, 0.3);
}
.vignette{
    position:fixed;
    inset:0;
    box-shadow:inset 0 0 250px rgba(0,0,0,0.95);
    pointer-events:none;
    z-index: 4;
}
.container{
    position:relative;
    z-index:5;
    text-align:center;
    width:85%;
    max-width:850px;
    padding:65px 40px;
    background: linear-gradient(rgba(10, 10, 10, 0.82), rgba(5, 5, 5, 0.88)), url("art.jpg") center center/cover no-repeat;
    border: 1px solid rgba(197, 168, 128, 0.25);
    box-shadow: 0 20px 70px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.8);
    border-radius: 4px;
    transition: transform 0.1s ease-out;
}
.top-text{
    font-family: 'Cinzel', serif;
    font-size:0.8rem;
    letter-spacing:6px;
    color:#888888;
    margin-bottom:25px;
}
.title{
    font-family: 'Cinzel', serif;
    font-size: 2.3rem;
    font-weight: 400;
    color: #c5a880; 
    letter-spacing: 9px;
    text-shadow: 0 0 15px rgba(197, 168, 128, 0.15);
    margin-bottom:45px;
}
.timer{
    font-family: 'Cinzel', serif;
    font-size:4.2rem;
    font-weight:400;
    color:#ffffff;
    letter-spacing: 5px;
    margin-bottom: 45px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.sub{
    color:#b3b3b3;
    font-size:1.15rem;
    font-style: italic;
    letter-spacing:1px;
    min-height: 28px;
}
.total{
    margin-top:40px;
    color:#5a5a5a;
    font-family: 'Cinzel', serif;
    line-height: 2.2;
    font-size:0.75rem;
    letter-spacing: 3px;
    border-top: 1px solid rgba(197, 168, 128, 0.1);
    padding-top: 20px;
}
.danger .title {
    color: #a32a2a;
    text-shadow: 0 0 15px rgba(163, 42, 42, 0.2);
}
.danger .top-text {
    color: #a32a2a;
}
@media(max-width:700px){
    .title{ font-size:1.4rem; letter-spacing: 5px; }
    .timer{ font-size:2.0rem; letter-spacing: 2px; }
    .container{ padding:45px 20px; width: 92%; }
    .top-text{ letter-spacing:4px; font-size:.7rem; }
    .sub{ font-size: 1rem; }
}
</style>
</head>
<body>

<div class="intro-overlay" id="intro">
    <button class="intro-btn" onclick="startMission()">INITIATE MISSION</button>
</div>

<div class="full-bg"></div>
<div class="overlay-dark"></div>
<div class="vignette"></div>

<audio id="bgMusic" loop preload="auto">
    <source src="skyfall.mp3" type="audio/mpeg">
</audio>

<div class="container" id="container">
    <div class="top-text" id="status-text">
        CLASSIFIED STATUS // ENCRYPTED LINK
    </div>
    <div class="title">
        OPERATION DGS
    </div>
    <div class="timer" id="count">
        00 : 00 : 00 : 00
    </div>
    <div class="sub" id="quote-area">
        "Loading intelligence..."
    </div>
    <div class="total" id="totals"></div>
</div>

function setRandomQuote() {
    const idx = Math.floor(Math.random() * quotes.length);
    document.getElementById("quote-area").innerHTML = `"${quotes[idx]}"`;
}

const targetDate = new Date("2026-07-19T10:15:00").getTime();
const displayEl = document.getElementById("count");
const totalDisplayEl = document.getElementById("totals");
const uiContainer = document.getElementById("container");
const headerStatus = document.getElementById("status-text");

function updateCountdown(){
    const current = Date.now();
    const diff = targetDate - current;

    if(diff <= 0){
        displayEl.innerHTML = "MISSION CONCLUDED";
        return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    const totalHours = Math.floor(diff / 3600000);
    const totalMins = Math.floor(diff / 60000);
    const totalSecs = Math.floor(diff / 1000);

    displayEl.innerHTML =
        `${String(days).padStart(2,'0')} :  
         ${String(hours).padStart(2,'0')} :  
         ${String(mins).padStart(2,'0')} :  
         ${String(secs).padStart(2,'0')}`;

    totalDisplayEl.innerHTML = `
        TOTAL: ${totalHours.toLocaleString('tr-TR')} HOURS //  
        ${totalMins.toLocaleString('tr-TR')} MINUTES //  
        ${totalSecs.toLocaleString('tr-TR')} SECONDS
    `;

    if(days <= 10){
        document.body.classList.add("danger");
        headerStatus.innerHTML = "CRITICAL WINDOW // IMMEDIATE ACTION REQUIRED";
    }
}

setRandomQuote();
updateCountdown();

setInterval(updateCountdown, 200);

document.addEventListener("mousemove",(e)=>{
    const x = (e.clientX / window.innerWidth - 0.5) * 10;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;
    uiContainer.style.transform = `translate(${x}px, ${y}px)`;
});

function startMission() {
    const bgTrack = document.getElementById("bgMusic");
    
    bgTrack.volume = 0.35; 
    bgTrack.play().catch(() => {});

    const introScreen = document.getElementById("intro");
    introScreen.style.opacity = "0";
    setTimeout(() => {
        introScreen.style.display = "none";
    }, 1200);
}
</script>

</body>
</html>
